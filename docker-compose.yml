services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-oficina_digital}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-oficina}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-oficina}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env (mínimo de 32 bytes)}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Defina ADMIN_EMAIL no arquivo .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD no arquivo .env (mínimo de 12 caracteres)}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4173,http://127.0.0.1:4173}
    depends_on:
      postgres:
        condition: service_healthy

  interface:
    build:
      context: ./interface-oficina
      dockerfile: Dockerfile
    ports:
      - "4173:80"
    depends_on:
      app:
        condition: service_started

  carga-demonstracao:
    image: postgres:17-alpine
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-oficina_digital}
      PGUSER: ${POSTGRES_USER:-oficina}
      PGPASSWORD: ${POSTGRES_PASSWORD:-oficina}
    volumes:
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/aguardar-e-carregar-demo.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oficina_digital}
      POSTGRES_USER: ${POSTGRES_USER:-oficina}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oficina}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
