# Banco em memória para testes — substitui o PostgreSQL
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;NON_KEYWORDS=value
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Deixa o schema.sql criar a tabela (evita o problema do tipo jsonb com H2)
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always

# Desabilita Flyway em testes (migrations usam sintaxe PostgreSQL incompatível com H2)
spring.flyway.enabled=false

# JWT com segredo mínimo de 32 bytes para testes
app.jwt.issuer=oficina-digital-test
app.jwt.segredo=segredo-de-teste-com-pelo-menos-32-bytes-ok
app.jwt.duracao=PT15M

# Admin fictício para testes (contexto carrega sem erro)
app.administrador.email=admin@test.com
app.administrador.senha=senha-teste-123
