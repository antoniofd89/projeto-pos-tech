spring.application.name=oficina-digital
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/oficina_digital}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:oficina}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:oficina}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
app.jwt.issuer=${JWT_ISSUER:oficina-digital}
app.jwt.segredo=${JWT_SECRET:}
app.jwt.duracao=${JWT_TTL:PT15M}
app.administrador.email=${ADMIN_EMAIL:}
app.administrador.senha=${ADMIN_PASSWORD:}
app.cors.origens=${CORS_ALLOWED_ORIGINS:http://localhost:4173,http://127.0.0.1:4173}
